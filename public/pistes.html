<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Chantier Tranquille — connexion</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Bleu réel de la marque, relevé dans le logo fourni. */
  --blue:#0F3071; --blue-line:#2A4A8C;
  --green:#1FA37A; --green-strong:#157C5C; --green-dark:#0F6349;
  --amber:#E8A33D;
  --slate:#5A6B82; --slate-2:#8B99AC;
  --bg:#F4F7FA; --line:#E3E8EF; --line-2:#D5DDE7;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Barlow',system-ui,sans-serif;color:var(--blue);background:#fff;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}

.page{display:grid;grid-template-columns:1fr 480px;height:100%}

/* ═══════════ VOLET IDENTITÉ ═══════════ */
.id{
  position:relative;background:var(--blue);color:#fff;overflow:hidden;
  display:flex;flex-direction:column;padding:52px 60px 46px;
}
/* La benne, en grand, débordant du cadre en bas à droite. */
.id::before{
  content:"";position:absolute;right:-8%;bottom:-6%;
  width:54%;aspect-ratio:907/604;
  background:url("/benne.png") no-repeat center/contain;
  pointer-events:none;
}
/* Bande d'avertissement en pied. */
.id::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:9px;
  background:repeating-linear-gradient(135deg,var(--amber) 0 19px,var(--blue) 19px 38px);
}
.id>*{position:relative;z-index:1}

.logo{width:186px;height:auto;display:block;flex:none;align-self:flex-start}

.core{margin-top:auto;max-width:20ch}
.core h2{
  font-family:'Barlow Condensed';font-weight:700;font-size:76px;line-height:.9;
  letter-spacing:.006em;text-transform:uppercase;
}
.core h2 em{font-style:normal;color:var(--amber)}
.core p{font-size:15.5px;line-height:1.5;color:#B3C4DE;max-width:34ch;margin-top:20px}

.figs{display:flex;margin-top:38px}
.figs>div{padding-right:30px;margin-right:30px;border-right:1px solid var(--blue-line)}
.figs>div:last-child{border-right:0;margin-right:0;padding-right:0}
.figs b{
  font-family:'Barlow Condensed';font-weight:700;font-size:46px;line-height:.9;display:block;
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.figs span{
  font-family:'Barlow Condensed';font-weight:600;font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:#93A8C9;display:block;margin-top:8px;
}

/* ═══════════ VOLET FORMULAIRE ═══════════ */
.auth{background:#fff;display:flex;flex-direction:column;padding:52px 56px 46px;border-left:1px solid var(--line)}
.form{flex:1;display:flex;flex-direction:column;justify-content:center}

.fd{margin-bottom:20px}
label{
  display:block;font-family:'Barlow Condensed';font-weight:600;font-size:11.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--slate);margin-bottom:8px;
}
.wrap{position:relative}
.in{
  width:100%;height:52px;border:1.5px solid var(--line-2);border-radius:6px;
  padding:0 15px;font:inherit;font-size:15px;color:var(--blue);background:#fff;
  transition:border-color .14s var(--ease),box-shadow .14s var(--ease);
}
.in::placeholder{color:#A3AFBE}
.in:hover{border-color:#BDC8D6}
.in:focus{outline:0;border-color:var(--green-strong);box-shadow:0 0 0 3px rgba(21,124,92,.15)}
.in.pw{padding-right:50px}

.eye{
  position:absolute;top:0;right:0;width:50px;height:52px;border:0;background:none;
  display:grid;place-items:center;cursor:pointer;color:var(--slate-2);
  transition:color .14s var(--ease);
}
.eye:hover{color:var(--blue)}
.eye:focus-visible{outline:2px solid var(--green-strong);outline-offset:-2px}

.bt{
  width:100%;height:54px;border:0;border-radius:6px;background:var(--green-strong);color:#fff;
  font-family:'Barlow Condensed';font-weight:700;font-size:17.5px;letter-spacing:.11em;text-transform:uppercase;
  cursor:pointer;margin-top:10px;
  transition:background-color .14s var(--ease),transform .1s var(--ease);
}
.bt:hover{background:var(--green-dark)}
.bt:active{transform:scale(.98)}
.bt:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.lk{
  display:inline-block;margin-top:22px;font-size:13.5px;color:var(--green-strong);
  text-decoration:none;font-weight:600;border-bottom:1.5px solid transparent;
  transition:border-color .14s var(--ease);
}
.lk:hover{border-bottom-color:var(--green-strong)}

.auth-foot{flex:none;font-size:12.5px;color:var(--slate-2)}
.auth-foot code{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--slate);background:var(--bg);padding:2px 7px;border-radius:4px;border:1px solid var(--line)}

@media (max-width:1160px){
  .page{grid-template-columns:1fr 420px}
  .id{padding:42px 44px 40px}
  .core h2{font-size:58px}
  .figs b{font-size:36px}
  .figs>div{padding-right:22px;margin-right:22px}
  .auth{padding:42px 40px 38px}
  .id::before{width:66%;right:-14%}
}
</style>
</head>
<body>

<div class="page">

  <section class="id">
    <img class="logo" src="/logo-blanc.png" alt="Chantier Tranquille">

    <div class="core">
      <h2>Dépenses communes, <em>compte tenu</em></h2>
      <p>Base vie, fluides, bennes, gardiennage. Ce que dix entreprises partagent sur un chantier, chiffré avant le premier coup de pelle.</p>
      <div class="figs">
        <div><b class="num">19</b><span>Prestations</span></div>
        <div><b class="num">3</b><span>Offres</span></div>
        <div><b class="num">24</b><span>Mois suivis</span></div>
      </div>
    </div>
  </section>

  <section class="auth">
    <form class="form" novalidate>
      <div class="fd">
        <label for="e">Adresse e-mail</label>
        <div class="wrap">
          <input class="in" id="e" name="email" type="email" inputmode="email"
                 autocomplete="username" placeholder="prenom.nom@entreprise.fr">
        </div>
      </div>

      <div class="fd">
        <label for="p">Mot de passe</label>
        <div class="wrap">
          <input class="in pw" id="p" name="password" type="password" autocomplete="current-password">
          <button class="eye" type="button" id="t" aria-label="Afficher le mot de passe">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1.8 12S5.4 5.2 12 5.2 22.2 12 22.2 12 18.6 18.8 12 18.8 1.8 12 1.8 12z"/>
              <circle cx="12" cy="12" r="3.1"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="bt" type="submit">Se connecter</button>
      <a class="lk" href="#">Mot de passe oublié&nbsp;?</a>
    </form>

    <div class="auth-foot">API <code>localhost:8010</code></div>
  </section>

</div>

<script>
const p=document.getElementById('p'), t=document.getElementById('t');
t.addEventListener('click',()=>{
  const shown = p.type==='text';
  p.type = shown ? 'password' : 'text';
  t.setAttribute('aria-label', shown ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
  p.focus();
});
</script>
</body>
</html>
